[package]
name = "nubmiddle"
version = "0.2.0"
edition = "2024"
description = "Windows tray tool that gives the TrackPoint-style pointing stick middle button both middle click and scrolling"
license = "MIT"
repository = "https://github.com/akivajp/nubmiddle"

# The Windows API is a dependency only when building for Windows.
# The decision logic (gesture) and options (config) are OS-independent, so `cargo test` works on Linux too.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
# Keep the exe small since it stays resident
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3.0.12"
