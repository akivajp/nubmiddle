# Settings for cross-compiling the Windows exe from WSL (Linux).
# Requires `sudo apt install mingw-w64` and `rustup target add x86_64-pc-windows-gnu` beforehand.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

[alias]
# `cargo win` / `cargo win --release` builds for Windows
win = "build --target x86_64-pc-windows-gnu"
